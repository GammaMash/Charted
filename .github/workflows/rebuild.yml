name: nightly-rebuild
# Refetch 12-month prices for the whole universe and rebake index.html, so every
# day's puzzle shows a genuinely current "last 12 months" chart.
# If the price fetch fails badly, fetch_data.py exits non-zero and nothing is
# committed — the site simply keeps yesterday's build.
# The same run writes social/today.png and social/today.json for the 7:00am ET post.
# It does not name a company. Yesterday's answer is a later job (reveal.yml),
# after that date is over in UTC−12, the same cutoff as the archive.
on:
  schedule:
    - cron: "0 0 * * *"    # 00:00 UTC = 7:00 PM ET the evening before (EST winter, UTC−5)
  workflow_dispatch: {}     # allow manual runs from the Actions tab
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh prices
        run: python3 fetch_data.py
      - name: Build puzzles
        run: python3 build_puzzles.py
      - name: Render link-preview card from yesterday's chart
        run: pip install --quiet pillow && python3 gen_og.py
      - name: Bake index.html
        run: python3 build_index.py
      - name: Build SEO archive
        run: python3 build_archive.py
      - name: Check archive and schedule
        run: python3 test_archive.py
      - name: Render today's social card
        run: python3 gen_social.py
      - name: Check social card
        run: python3 test_social.py
      - name: Commit if changed
        run: |
          git config user.name "GammaMash"
          git config user.email "264815017+GammaMash@users.noreply.github.com"
          git add prices_raw.json index.html og.png archive sitemap.xml robots.txt social/today.png social/today.json
          if ! git diff --cached --quiet; then
            git commit -m "nightly data refresh"
            git push
          else
            echo "no changes"
          fi
